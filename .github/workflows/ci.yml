name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  statuses: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DRIVER: mock
      APP_AUTH_DISABLED: "false"
      SESSION_SECRET: ci-session-secret-ci-session-secret-123456
      MCP_AUTH_MODE: token
      MCP_API_TOKEN: ci-mcp-token-ci-mcp-token-123456
      NEXT_PUBLIC_APP_NAME: AgencyOS CI
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate migration sequence
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const files = fs.readdirSync("drizzle").filter((name) => /^\d{4}_.+\.sql$/.test(name)).sort();
          if (!files.length) throw new Error("No SQL migrations found");
          const prefixes = files.map((name) => name.slice(0, 4));
          const duplicates = prefixes.filter((value, index) => prefixes.indexOf(value) !== index);
          if (duplicates.length) throw new Error("Duplicate migration prefixes: " + [...new Set(duplicates)].join(", "));
          for (let index = 1; index < prefixes.length; index += 1) {
            if (Number(prefixes[index]) <= Number(prefixes[index - 1])) {
              throw new Error("Migrations are not strictly ordered: " + files.join(", "));
            }
          }
          console.log("Migrations:", files.join(", "));
          NODE

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migration runner safety tests
        run: node --test scripts/production-migrations.test.mjs

      - name: Production build
        run: npm run build

      - name: Runtime smoke on built artifact
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/agencyos-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/agencyos-next.log' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          jq -e '.ok == true and .dataDriver == "mock"' /tmp/health.json
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/login | grep -q "AgencyOS Leads"
          curl --fail --silent --show-error --location --max-time 5 http://127.0.0.1:3000/ | grep -q "AgencyOS Leads"

  postgres-migrations:
    name: PostgreSQL 16 migration and privilege smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agencyos
          POSTGRES_USER: agencyos
          POSTGRES_PASSWORD: agencyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencyos -d agencyos"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: agencyos
      PGPASSWORD: agencyos
      PGDATABASE: agencyos
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install psql if needed
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply all SQL migrations to real PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL
          for file in drizzle/[0-9][0-9][0-9][0-9]_*.sql; do
            if [[ "$file" == *"/0008_"* ]]; then
              # A pre-existing narrowly scoped credential must remain unchanged.
              psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.users (id,name,email,role)
          VALUES ('00000000-0000-4000-8000-000000000001','Migration Tester','test@example.test','ADMIN');
          INSERT INTO public.mcp_credentials
            (user_id,name,token_hash,token_prefix,scopes)
          VALUES
            ('00000000-0000-4000-8000-000000000001','pre-migration-credential','migration-test-token-hash','mcp-test','["leads.read"]'::jsonb);
          SQL
            fi
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done

      - name: Verify grants, version constraints and safe credential scopes
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE existing_scopes jsonb;
          BEGIN
            SELECT scopes INTO existing_scopes
              FROM public.mcp_credentials WHERE name='pre-migration-credential';
            IF existing_scopes IS DISTINCT FROM '["leads.read"]'::jsonb THEN
              RAISE EXCEPTION 'MCP scopes changed unexpectedly: %', existing_scopes;
            END IF;

            IF (SELECT count(*) FROM pg_tables
                WHERE schemaname='public' AND tablename IN
                  ('business_profiles','diagnostics','score_assessments','ai_runs',
                  'prospecting_runs','channel_connections','conversations','channel_messages',
                  'approval_requests','qualifications','proposals','contracts','client_projects',
                  'project_obligations')) <> 14 THEN
              RAISE EXCEPTION 'Expected 14 automation tables';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public'
                AND c.relname IN ('business_profiles','diagnostics','approval_requests',
                    'qualifications','contracts','project_obligations')
                AND NOT c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'Automation tables missing RLS';
            END IF;

            IF has_table_privilege('anon','public.contracts','SELECT') OR
               has_table_privilege('authenticated','public.contracts','SELECT') THEN
              RAISE EXCEPTION 'Data API principals unexpectedly can read contracts';
            END IF;

            IF NOT EXISTS(SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND indexname='qualifications_lead_uidx')
            OR NOT EXISTS(SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND indexname='project_obligations_project_source_uidx') THEN
              RAISE EXCEPTION 'Missing required uniqueness constraints';
            END IF;
          END $verify$;
          SQL

      - name: Smoke actual CRUD on newly migrated tables
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.leads (id,name)
          VALUES ('00000000-0000-4000-8000-000000000002','PostgreSQL CI Lead');
          INSERT INTO public.business_profiles
            (lead_id,created_by_type,created_by_id)
          VALUES ('00000000-0000-4000-8000-000000000002','SYSTEM','migration-smoke');
          INSERT INTO public.diagnostics
            (lead_id,generated_by_type,generated_by_id)
          VALUES ('00000000-0000-4000-8000-000000000002','SYSTEM','migration-smoke');
          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM public.business_profiles WHERE lead_id='00000000-0000-4000-8000-000000000002') <> 1
              OR (SELECT count(*) FROM public.diagnostics WHERE lead_id='00000000-0000-4000-8000-000000000002') <> 1 THEN
              RAISE EXCEPTION 'Automation CRUD smoke failed';
            END IF;
          END $verify$;
          SQL

  preview-deployment:
    name: Vercel Preview
    if: github.event_name == 'pull_request'
    needs: [quality-gate, postgres-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      statuses: read
    env:
      SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for Vercel preview
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            payload="$(curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA/status")"

            state="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"
            target="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].target_url // ""')"
            echo "Vercel preview state: $state $target"

            case "$state" in
              success) exit 0 ;;
              error|failure) exit 1 ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Vercel preview status" >&2
          exit 1
