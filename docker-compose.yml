services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agencyos
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: agencyos
    ports:
      - "5432:5432"
    volumes:
      - agencyos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyos -d agencyos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agencyos_pgdata:
