name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DRIVER: mock
      APP_AUTH_DISABLED: "false"
      MCP_AUTH_MODE: token
      MCP_API_TOKEN: ci-mcp-token-ci-mcp-token-123456
      NEXT_PUBLIC_APP_NAME: AgencyOS CI
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate migration sequence
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const files = fs.readdirSync("drizzle").filter((name) => /^\d{4}_.+\.sql$/.test(name)).sort();
          if (!files.length) throw new Error("No SQL migrations found");
          const prefixes = files.map((name) => name.slice(0, 4));
          const duplicates = prefixes.filter((value, index) => prefixes.indexOf(value) !== index);
          if (duplicates.length) throw new Error("Duplicate migration prefixes: " + [...new Set(duplicates)].join(", "));
          for (let index = 1; index < prefixes.length; index += 1) {
            if (Number(prefixes[index]) <= Number(prefixes[index - 1])) {
              throw new Error("Migrations are not strictly ordered: " + files.join(", "));
            }
          }
          console.log("Migrations:", files.join(", "));
          NODE

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Runtime smoke on built artifact
        run: |
          set -euo pipefail

          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/agencyos-next.log 2>&1 &
          APP_PID=$!

          cleanup() {
            status=$?
            kill "$APP_PID" 2>/dev/null || true
            cat /tmp/agencyos-next.log
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          test -s /tmp/health.json
          jq -e '.ok == true and .dataDriver == "mock"' /tmp/health.json

          login_status="$(curl --silent --show-error --output /tmp/login.html --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/login)"
          test "$login_status" = "200"
          grep -q "AgencyOS Leads" /tmp/login.html

          auth_status="$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/auth/me)"
          test "$auth_status" = "401"
          jq -e '.error.code == "AUTH_REQUIRED"' /tmp/auth.json

          root_status="$(curl --silent --show-error --dump-header /tmp/root.headers --output /tmp/root.html --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/)"
          case "$root_status" in
            302|303|307|308) ;;
            *)
              echo "Expected unauthenticated / to redirect, got HTTP $root_status" >&2
              exit 1
              ;;
          esac
          grep -Eiq '^location: /login([?[:space:]]|$)' /tmp/root.headers

          if grep -Eq '⨯ Error:|uncaughtException|unhandledRejection' /tmp/agencyos-next.log; then
            echo "Runtime smoke detected an application error:" >&2
            cat /tmp/agencyos-next.log >&2
            exit 1
          fi

  preview-deployment:
    name: Vercel Preview
    if: github.event_name == 'pull_request'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      statuses: read
    env:
      SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for Vercel preview
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            payload="$(curl --fail --silent --show-error               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA/status")"

            state="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")] | sort_by(.updated_at) | last | .state // "missing"')"
            target="$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")] | sort_by(.updated_at) | last | .target_url // ""')"
            echo "Vercel preview state: $state $target"

            case "$state" in
              success)
                test -n "$target"
                exit 0
                ;;
              error|failure) exit 1 ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Vercel preview status" >&2
          exit 1
